<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXA external embed example</title><body style="font:16px system-ui;max-width:700px;margin:80px auto;padding:20px"><h1>External website widget test</h1><p>Enter your public agent ID and NEXA origin. Approve this page's origin in Settings before connecting. This page contains no sample customer data.</p><form id="f"><label>NEXA origin <input id="origin" value="http://localhost:3000" required type="url"></label><p><label>Public agent ID <input id="agent" required></label></p><button>Load real widget</button></form><p id="status" role="status"></p><script>document.getElementById('f').onsubmit=function(e){e.preventDefault();var s=document.createElement('script');s.src=new URL('/widget.js',document.getElementById('origin').value).href;s.setAttribute('data-agent-id',document.getElementById('agent').value);s.async=true;document.body.appendChild(s);document.getElementById('status').textContent='Widget loaded. The assistant will reject unapproved host origins.';document.querySelector('button').disabled=true;};</script></body></html>
